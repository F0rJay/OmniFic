name: 世界书设计与生成
summary: 通过对话引导用户从零构建小说世界观，生成可导入的 SillyTavern 世界书 JSON。
is_enabled: true
content: |
  # 世界书设计与生成操作手册

  当用户需要创建世界书、设定集、世界观资料时加载。通过渐进式对话收集信息，最终生成标准 SillyTavern 世界书 JSON 格式。

  ## SillyTavern 世界书格式

  世界书是一个 JSON 对象，核心是 `entries` 字典，每个条目包含：

  ```json
  {
    "entries": {
      "0": {
        "uid": 0,
        "name": "条目名称",
        "content": "条目的详细内容...",
        "comment": "条目名称（同 name，用于显示）",
        "disable": false,
        "order": 1
      }
    }
  }
  ```

  生成时 `uid` 从 0 递增，`order` 从 1 递增，`disable` 默认 false，`comment` 与 `name` 保持一致。

  ## 对话流程

  ### 提问规则（重要）

  使用 `ask_user` 工具提问时，必须遵守以下规则：

  1. **每个问题必须提供选项**：不要只给一个空问题让用户自行输入。为每个问题提供 3-8 个选项，把你认为最可能的放在首位并标注 `(推荐)`
  2. **允许多选的问题必须设置 `multi_select: true`**：当一个问题需要用户同时选择多个答案时（如"世界书需要覆盖哪些方面"），在 `ask_user` 工具的 Question 对象中设置 `multi_select: true`。否则前端会渲染为单选
  3. **选项必须包含 description**：每个选项都要有简短说明，帮助用户理解
  4. **每次问 1-3 个问题**：不要一次性问太多，根据回答逐步深入

  **正确示例**：
  ```
  ask_user(
    questions=[{
      title: "世界的核心力量体系是什么类型？",
      description: "这决定了世界书的力量设定部分如何组织",
      options: [
        {label: "修炼境界体系 (推荐)", description: "如修仙的练气→筑基→金丹，逐步晋升"},
        {label: "魔法/元素体系", description: "如火系、水系魔法，等级划分"},
        {label: "科技/异能体系", description: "超能力、科技装备、基因改造等"},
        {label: "混合体系", description: "多种力量体系并存"}
      ],
      multi_select: false
    }]
  )
  ```

  **多选示例**：
  ```
  ask_user(
    questions=[{
      title: "世界书需要覆盖哪些方面？",
      description: "选择你需要的设定维度，我会据此规划条目",
      options: [
        {label: "力量体系", description: "修炼境界、能力分级、代价与限制"},
        {label: "地理环境", description: "世界地图、重要地点、气候"},
        {label: "势力组织", description: "门派、国家、帮派、公司"},
        {label: "历史背景", description: "重大事件、纪年、文明兴衰"},
        {label: "种族物种", description: "不同种族、生物种类"},
        {label: "文化风俗", description: "语言、宗教、节日、习俗"}
      ],
      multi_select: true
    }]
  )
  ```

  ### 第一阶段：了解需求

  向用户提问，收集以下信息（按需，不必全部强制）：

  - **题材类型**：仙侠？都市？科幻？奇幻？末日？历史？（提供选项）
  - **核心设定**：这个世界最独特的规则或概念是什么？（提供常见选项 + 自定义）
  - **力量体系**：修炼/魔法/科技/异能？（提供选项，可多选）
  - **地理范围**：故事主要发生在哪些地方？（提供选项 + 自定义）
  - **世界书覆盖范围**：需要哪些维度的设定？（多选：力量体系/地理/势力/历史/种族/文化/物品）

  每次只问 1-3 个问题，根据用户的回答继续深入。不要一次性抛出所有问题。

  ### 第二阶段：补充与完善

  根据用户提供的信息，主动补充用户可能遗漏的维度：

  | 维度 | 说明 | 示例 |
    |------|------|------|
  | 力量体系 | 修炼境界、能力分级、代价与限制 | 淬体→练气→筑基... |
  | 社会结构 | 阶级、职业、经济体系 | 凡人/修士/仙人的社会分层 |
  | 地理环境 | 重要地点、气候、危险区域 | 云隐城、万妖谷、天柱峰 |
  | 势力组织 | 门派、国家、帮派、公司 | 天剑宗、联邦政府、暗夜会 |
  | 历史背景 | 影响当前剧情的过往事件 | 千年前的封神之战 |
  | 特殊物品 | 重要道具、法宝、科技产品 | 灵石、星舰、系统面板 |
  | 种族物种 | 人类之外的智慧种族或生物 | 妖族、精灵、变异兽 |
  | 禁忌与规则 | 世界的底层法则和禁忌 | 修士不得在凡人面前斗法 |

  提出补充建议时，说明理由，让用户确认或修改。

  ### 第三阶段：生成世界书

  信息收集充分后，将所有设定组织为世界书条目并输出 JSON。

  **条目设计原则**：
  - 每个条目聚焦一个独立的设定主题（一个地点、一个势力、一个体系）
  - 条目名称简洁明了，不超过 15 个字
  - 条目内容结构化：使用要点列表或短段落，不要大段流水文字
  - 内容量适中：每个条目 100-500 字，过长的拆分为多个条目
  - 按逻辑排序：先世界总览，再力量体系，然后地理/势力/物品等

  **输出格式**：
  直接输出完整的 JSON，用 ```json 代码块包裹。确保 JSON 格式正确，可直接保存为 .json 文件导入。

  ## 条目质量标准

  **好的条目**：
  ```
  名称：修炼境界体系
  内容：
  修炼共分九重境界，由低到高：
  - 淬体（肉身强化，无法外放灵力）
  - 练气（感知灵气，初步施展小术）
  - 筑基（灵力凝实，可御剑飞行）
  - 金丹（体内结丹，寿命达五百岁）
  - 元婴（神识出窍，可千里传音）
  - 化神（掌控天地法则）
  - 渡劫（引动天劫，九死一生）
  - 大乘（法力通天，接近仙人）
  - 飞升（破开虚空，进入仙界）
  每个大境界分初期、中期、后期、巅峰四个小阶段。
  ```

  **不好的条目**：
  ```
  名称：设定
  内容：这个世界有很多设定，修炼分为很多境界，还有各种势力和地点。
  ```

  ## 注意事项

  - 不要编造用户明确未提及且不属于通用题材常识的内容，除非以建议形式提出并获得确认
  - 世界书是给 AI Agent 检索用的参考资料，内容应当客观、准确、信息密度高
  - 避免在条目中写入剧情或角色对话，世界书记录的是"设定"而非"故事"
  - 如果用户的设定有矛盾或逻辑漏洞，应指出并建议修正
