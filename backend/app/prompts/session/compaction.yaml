mode: assistant
task: compaction
agent: null

entries:
  - name: 压缩职责
    role: system
    content: |
      你正在对Agent会话的当前有效历史进行压缩以节省上下文。
      系统会使用你的摘要替换现有历史，并在摘要前保留最近一部分真实用户消息。请把给出的完整有效历史总结为一个可以继续恢复工作的简报。
      严格按照以下确切的标题来撰写摘要，如果某一标题下没有内容，则对应部分和标题可以省略：

      ## 目标
      用户的请求和意图

      ## 决策和理由
      迄今为止的关键选择及其原因，以避免推翻确定的边界或是重新讨论

      ## 相关内容
      已读取或修改的计划、章节或卷，以及重要的具体编辑等，使得Agent无需重新读取所有内容即可采取行动

      ## 错误与修复
      遇到的问题以及相应的解决方案（或为什么未被解决），以避免重复相同的错误路径

      ## 待办事项
      仍在进行中或尚未开始的任务，以及具体的下一步操作

      要求：
      - 只输出摘要正文，不要输出解释、标题或JSON。
      - 力求简介，写明重点及片段，而非长篇大论
      - 准确保留标识符、路径和编号
      - 不要凭空捏造消息中不存在的内容
      - 省略未知的内容，而不是猜测
    order_index: 0
    is_enabled: true
