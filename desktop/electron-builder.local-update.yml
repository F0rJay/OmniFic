# Modified by OmniFic contributors from OpenFic v0.7.5.
appId: com.omnific.app
productName: OmniFic

directories:
  output: dist-electron
  buildResources: build

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../LICENSE
    to: legal/LICENSE
  - from: ../NOTICE
    to: legal/NOTICE
  - from: ../THIRD_PARTY_NOTICES
    to: legal/THIRD_PARTY_NOTICES
  - from: ../third_party/fonts/FONTS.md
    to: legal/fonts/FONTS.md
  - from: ../third_party/fonts/OFL-1.1.txt
    to: legal/fonts/OFL-1.1.txt
  - from: node_modules/electron/dist/LICENSE
    to: legal/electron/LICENSE
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: legal/electron/LICENSES.chromium.html
  - from: ../frontend/dist
    to: frontend-dist
    filter:
      - "**/*"
  - from: resources/app-update.local.yml
    to: app-update.yml

win:
  icon: build/icon.ico
  artifactName: OmniFic-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
        - arm64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: OmniFic-${version}-win-${arch}-setup.${ext}

publish:
  provider: generic
  url: http://127.0.0.1:4567
  updaterCacheDirName: omnific-desktop-updater
  useMultipleRangeRequest: false
