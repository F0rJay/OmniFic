appId: com.omnific.app
productName: OmniFic

directories:
  output: dist-electron
  buildResources: build

publish:
  provider: github
  owner: F0rJay
  repo: OmniFic
  releaseType: release

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../frontend/dist
    to: frontend-dist
    filter:
      - "**/*"
  - from: resources/app-update.yml
    to: app-update.yml

win:
  icon: build/icon.ico
  artifactName: OmniFic-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: OmniFic-${version}-win-${arch}-setup.${ext}

mac:
  icon: build/icon.icns
  artifactName: OmniFic-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  identity: null

linux:
  icon: build/icon.png
  artifactName: OmniFic-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: tar.gz
      arch:
        - x64
        - arm64
  category: Utility
