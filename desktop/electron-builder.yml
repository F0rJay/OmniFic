appId: com.omnific.app
productName: OmniFic

directories:
  output: dist-electron
  buildResources: build

afterPack: ./scripts/after-pack.mjs

publish:
  provider: github
  owner: F0rJay
  repo: OmniFic
  releaseType: release

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../frontend/dist
    to: frontend-dist
    filter:
      - "**/*"
  - from: resources/app-update.yml
    to: app-update.yml
  - from: resources/omnific-wheel
    to: omnific-wheel
    filter:
      - "*.whl"

win:
  icon: build/icon.ico
  artifactName: OmniFic-${version}-win-${arch}.${ext}
  target:
    - nsis
    - zip

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: OmniFic-${version}-win-${arch}-setup.${ext}

mac:
  icon: build/icon.icns
  artifactName: OmniFic-${version}-mac-${arch}.${ext}
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  identity: null

linux:
  icon: build/icon.png
  artifactName: OmniFic-${version}-linux-${arch}.${ext}
  target:
    - AppImage
    - tar.gz
  category: Utility
