# Modified by OmniFic contributors from OpenFic v0.7.5.
name: Package

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22.18.0'
  PNPM_VERSION: '11.8.0'
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  UV_HTTP_TIMEOUT: '15'
  UV_HTTP_RETRIES: '1'

jobs:
  # ---------------------------------------------------------------- context
  context:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      image: ${{ steps.meta.outputs.image }}
      major_minor: ${{ steps.meta.outputs.major_minor }}
    steps:
      - id: meta
        run: |
          RELEASE_TAG=${GITHUB_REF#refs/tags/}
          VERSION=${RELEASE_TAG#v}
          IMAGE=ghcr.io/${{ github.repository_owner }}/omnific
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"

  # 首发 tag 可能尚未由 release-please 创建 GitHub Release；后续资产上传统一依赖此 job。
  ensure-release:
    needs: [context]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 创建或复用 GitHub Release
        run: |
          if gh release view "${{ needs.context.outputs.release_tag }}" >/dev/null 2>&1; then
            echo "GitHub Release 已存在"
            exit 0
          fi
          gh release create "${{ needs.context.outputs.release_tag }}" \
            --title "${{ needs.context.outputs.release_tag }}" \
            --generate-notes

  # ---------------------------------------------------------------- frontend
  build-frontend:
    needs: [context]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 配置 pnpm store
        run: pnpm config set store-dir "${{ github.workspace }}/.pnpm-store"
      - uses: actions/cache/restore@v5
        id: pnpm-cache
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-frontend-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-frontend-
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-
      - name: 构建前端产物
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          OMNIFIC_BUILD_VERSION=${{ needs.context.outputs.version }} pnpm build
          python3 ../scripts/check_license_compliance.py \
            --skip-generated-check \
            --artifact-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
      - uses: actions/cache/save@v5
        if: ${{ steps.pnpm-cache.outputs.cache-hit != 'true' }}
        with:
          path: .pnpm-store
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

  # ---------------------------------------------------------------- pypi
  pypi:
    needs: [context, build-frontend]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 配置 pnpm store
        run: pnpm config set store-dir "${{ github.workspace }}/.pnpm-store"
      - uses: actions/cache/restore@v5
        id: pnpm-cache
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-frontend-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-frontend-
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
      - name: 生成 uv 缓存 key lock
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("backend/uv.lock")
          target = Path("backend/.uv-cache-key.lock")
          lines = source.read_text(encoding="utf-8").splitlines()
          normalized: list[str] = []
          is_omnific_package = False

          for line in lines:
              if line == "[[package]]":
                  is_omnific_package = False
              elif line == 'name = "omnific"':
                  is_omnific_package = True

              if is_omnific_package and line.startswith("version = "):
                  continue

              normalized.append(line)

          target.write_text("\n".join(normalized) + "\n", encoding="utf-8")
          PY
      - uses: actions/cache/restore@v5
        id: uv-cache
        with:
          path: .uv-cache
          key: ${{ runner.os }}-${{ runner.arch }}-uv-${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/.uv-cache-key.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-uv-${{ env.PYTHON_VERSION }}-
      - name: 构建后端 Python 包
        working-directory: backend
        run: |
          python3 ../scripts/run_uv_with_fallback.py build
          wheel="$(find dist -maxdepth 1 -name 'omnific-*.whl' -print -quit)"
          sdist="$(find dist -maxdepth 1 -name 'omnific-*.tar.gz' -print -quit)"
          python3 ../scripts/check_license_compliance.py \
            --skip-generated-check \
            --wheel "$wheel" \
            --sdist "$sdist"
      - name: 冒烟验证本地 wheel
        working-directory: backend
        run: |
          smoke_root="$(mktemp -d)"
          smoke_venv="$smoke_root/venv"
          smoke_data="$smoke_root/data"
          python -m venv "$smoke_venv"
          python3 ../scripts/run_uv_with_fallback.py pip install \
            --python "$smoke_venv/bin/python" \
            dist/omnific-*.whl
          "$smoke_venv/bin/python" -c 'import greenlet; print(f"greenlet {greenlet.__version__}")'
          "$smoke_venv/bin/omnific" version | grep "${{ needs.context.outputs.version }}"
          OMNIFIC_DATA_DIR="$smoke_data" "$smoke_venv/bin/omnific" serve --host 127.0.0.1 --port 8765 > "$smoke_root/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat "$smoke_root/server.log"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8765/api/v1/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: backend-wheel
          path: backend/dist/*.whl
      - uses: actions/cache/save@v5
        if: ${{ steps.pnpm-cache.outputs.cache-hit != 'true' }}
        with:
          path: .pnpm-store
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v5
        if: ${{ steps.uv-cache.outputs.cache-hit != 'true' }}
        with:
          path: .uv-cache
          key: ${{ steps.uv-cache.outputs.cache-primary-key }}
      - id: pypi-version
        name: 检查 PyPI 是否已发布当前版本
        run: |
          status_code="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --retry 3 \
            --retry-all-errors \
            "https://pypi.org/pypi/omnific/${{ needs.context.outputs.version }}/json")"
          case "$status_code" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "无法确认 PyPI 版本状态，HTTP ${status_code}" >&2
              exit 1
              ;;
          esac
      - name: 发布到 PyPI
        if: ${{ steps.pypi-version.outputs.exists != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/dist

  # ---------------------------------------------------------------- docker
  docker:
    needs: [context]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: linux-aarch64
    runs-on: ${{ matrix.runner }}
    env:
      BUILDX_NO_DEFAULT_ATTESTATIONS: true
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          IMAGE=${{ needs.context.outputs.image }}
          VERSION=${{ needs.context.outputs.version }}
          MAJOR_MINOR=${{ needs.context.outputs.major_minor }}
          SUFFIX=${{ matrix.suffix }}

          echo "tags=${IMAGE}:latest-${SUFFIX},${IMAGE}:${VERSION}-${SUFFIX},${IMAGE}:${MAJOR_MINOR}-${SUFFIX}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Load the native image into the runner first. The registry is only
          # updated after the health endpoint has passed below.
          load: true
          push: false
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=docker-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.suffix }}
      - name: 冒烟验证发布镜像
        run: |
          image="${{ needs.context.outputs.image }}:${{ needs.context.outputs.version }}-${{ matrix.suffix }}"
          container_id="$(docker run -d -p 127.0.0.1::8000 "$image")"
          trap 'docker logs "$container_id"; docker rm -f "$container_id"' EXIT

          fail_smoke() {
            echo "::error title=Docker 镜像冒烟验证失败::$1"
            docker inspect "$container_id" --format 'status={{.State.Status}} exit_code={{.State.ExitCode}} error={{.State.Error}}' || true
            exit 1
          }

          sleep 2
          running="$(docker inspect "$container_id" --format '{{.State.Running}}')"
          test "$running" = "true" || fail_smoke "容器在运行时检查前已经退出"

          for legal_file in LICENSE NOTICE THIRD_PARTY_NOTICES fonts/FONTS.md fonts/OFL-1.1.txt; do
            docker exec "$container_id" test -s "/app/legal/$legal_file" || \
              fail_smoke "镜像缺少法律材料：/app/legal/$legal_file"
          done

          uv_version="$(docker exec "$container_id" /bin/uv --version)" || \
            fail_smoke "无法读取镜像内的 uv 版本"
          [[ "$uv_version" == "uv 0.11.32" || "$uv_version" == "uv 0.11.32 "* ]] || \
            fail_smoke "镜像内 uv 版本不匹配：$uv_version"

          docker exec "$container_id" test -s /usr/share/doc/base-files/copyright || \
            fail_smoke "基础镜像缺少 Debian base-files 版权文件"

          port="$(docker port "$container_id" 8000/tcp | sed 's/.*://')"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/api/v1/health"; then
              exit 0
            fi
            sleep 1
          done
          fail_smoke "health API 在 30 秒内未就绪"
      - name: 推送已验证的架构镜像
        run: |
          image="${{ needs.context.outputs.image }}"
          version="${{ needs.context.outputs.version }}"
          major_minor="${{ needs.context.outputs.major_minor }}"
          suffix="${{ matrix.suffix }}"
          docker push "${image}:latest-${suffix}"
          docker push "${image}:${version}-${suffix}"
          docker push "${image}:${major_minor}-${suffix}"

  docker-manifest:
    needs: [context, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 发布多架构 Docker 标签
        run: |
          IMAGE=${{ needs.context.outputs.image }}
          VERSION=${{ needs.context.outputs.version }}
          MAJOR_MINOR=${{ needs.context.outputs.major_minor }}

          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            "${IMAGE}:latest-linux-x86_64" \
            "${IMAGE}:latest-linux-aarch64"
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-linux-x86_64" \
            "${IMAGE}:${VERSION}-linux-aarch64"
          docker buildx imagetools create \
            -t "${IMAGE}:${MAJOR_MINOR}" \
            "${IMAGE}:${MAJOR_MINOR}-linux-x86_64" \
            "${IMAGE}:${MAJOR_MINOR}-linux-aarch64"

  # ---------------------------------------------------------------- desktop
  desktop:
    needs: [context, build-frontend, pypi]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            electron_args: '--win --x64'
            artifact_name: windows-update-x86_64
            artifact_arch: x86_64
          - os: windows-11-arm
            electron_args: '--win --arm64'
            artifact_name: windows-update-arm64
            artifact_arch: arm64
          - os: macos-15-intel
            electron_args: '--mac --x64'
            artifact_name: macos-update-x86_64
            artifact_arch: x86_64
          - os: macos-15
            electron_args: '--mac --arm64'
            artifact_name: macos-update-arm64
            artifact_arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/download-artifact@v8
        with:
          name: backend-wheel
          path: desktop/resources/omnific-wheel
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 配置 pnpm store
        run: pnpm config set store-dir "${{ github.workspace }}/.pnpm-store"
      - uses: actions/cache/restore@v5
        id: pnpm-cache
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-desktop-${{ hashFiles('desktop/pnpm-lock.yaml', 'frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-desktop-
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-frontend-
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-
      - uses: actions/cache/restore@v5
        id: electron-cache
        with:
          path: |
            .electron-cache
            .electron-builder-cache
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('desktop/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-
      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: 安装桌面端依赖
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: 构建桌面端
        working-directory: desktop
        run: pnpm build
      - name: 验证便携 Python 路径
        working-directory: desktop
        run: pnpm test:runtime-paths
      - name: 验证内置后端 wheel
        working-directory: desktop
        run: node scripts/verify-bundled-wheel.mjs
      - name: 构建 Electron 安装包
        working-directory: desktop
        run: pnpm exec electron-builder --config electron-builder.yml ${{ matrix.electron_args }} --publish never
      - name: 验证桌面安装包许可证材料
        working-directory: desktop
        run: node scripts/verify-legal-resources.mjs
      - name: 统一安装包架构命名
        working-directory: desktop
        run: node scripts/normalize-artifact-names.mjs
      - name: 校验 macOS 安装包完整性
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          OMNIFIC_ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
          OMNIFIC_REQUIRE_BUNDLED_WHEEL: 'true'
        run: node scripts/verify-macos-artifacts.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            desktop/dist-electron/*.exe
            desktop/dist-electron/*.blockmap
            desktop/dist-electron/*.zip
            desktop/dist-electron/*.dmg
            desktop/dist-electron/*.yml
      - uses: actions/cache/save@v5
        if: ${{ steps.pnpm-cache.outputs.cache-hit != 'true' }}
        with:
          path: .pnpm-store
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v5
        if: ${{ steps.electron-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            .electron-cache
            .electron-builder-cache
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}

  desktop-windows-update:
    needs: [context, desktop, ensure-release]
    if: ${{ always() && needs.desktop.result == 'success' && needs.ensure-release.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-update-*
          merge-multiple: true
          path: desktop/dist-electron
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 整理 Windows 自动更新产物
        working-directory: desktop
        run: node scripts/prepare-windows-update.mjs
      - name: 发布 Windows 自动更新产物
        run: |
          gh release upload "${{ needs.context.outputs.release_tag }}" \
            desktop/dist-electron/OmniFic-*-win-*-setup.exe \
            desktop/dist-electron/OmniFic-*-win-*-setup.exe.blockmap \
            desktop/dist-electron/OmniFic-*-win-*.zip \
            desktop/dist-electron/latest*.yml \
            --clobber

  desktop-macos-update:
    needs: [context, desktop, ensure-release]
    if: ${{ always() && needs.desktop.result == 'success' && needs.ensure-release.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-update-*
          merge-multiple: true
          path: desktop/dist-electron
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 整理 macOS 自动更新产物
        working-directory: desktop
        run: node scripts/prepare-macos-update.mjs
      - name: 发布 macOS 自动更新产物
        run: |
          gh release upload "${{ needs.context.outputs.release_tag }}" \
            desktop/dist-electron/OmniFic-*-mac-*.zip \
            desktop/dist-electron/OmniFic-*-mac-*.dmg \
            desktop/dist-electron/latest-mac.yml \
            --clobber

  # ---------------------------------------------------------------- release
  publish-release:
    needs: [context, ensure-release, desktop, desktop-windows-update, desktop-macos-update, docker-manifest]
    if: ${{ always() && needs.ensure-release.result == 'success' && needs.desktop.result == 'success' && needs.desktop-windows-update.result == 'success' && needs.desktop-macos-update.result == 'success' && needs.docker-manifest.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 验证 GitHub Release 桌面产物
        run: |
          version="${{ needs.context.outputs.version }}"
          assets="$(gh release view "${{ needs.context.outputs.release_tag }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
          for expected in \
            "OmniFic-${version}-win-x86_64-setup.exe" \
            "OmniFic-${version}-win-arm64-setup.exe" \
            "OmniFic-${version}-win-x86_64.zip" \
            "OmniFic-${version}-win-arm64.zip" \
            "OmniFic-${version}-mac-x86_64.dmg" \
            "OmniFic-${version}-mac-arm64.dmg" \
            "OmniFic-${version}-mac-x86_64.zip" \
            "OmniFic-${version}-mac-arm64.zip" \
            latest.yml \
            latest-win-x86_64.yml \
            latest-win-arm64.yml \
            latest-mac.yml
          do
            grep -Fxq "$expected" <<< "$assets" || {
              echo "GitHub Release 缺少产物：$expected" >&2
              exit 1
            }
          done
